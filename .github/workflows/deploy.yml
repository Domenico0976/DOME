name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config from secrets
        run: |
          sed -i \
            -e "s|___FIREBASE_API_KEY___|${{ secrets.FIREBASE_API_KEY }}|g" \
            -e "s|___FIREBASE_AUTH_DOMAIN___|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" \
            -e "s|___FIREBASE_DATABASE_URL___|${{ secrets.FIREBASE_DATABASE_URL }}|g" \
            -e "s|___FIREBASE_PROJECT_ID___|${{ secrets.FIREBASE_PROJECT_ID }}|g" \
            -e "s|___FIREBASE_STORAGE_BUCKET___|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" \
            -e "s|___FIREBASE_MESSAGING_SENDER_ID___|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" \
            -e "s|___FIREBASE_APP_ID___|${{ secrets.FIREBASE_APP_ID }}|g" \
            index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
