<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#083D2A">
  <title>DOME | Portfolio</title>
  <meta name="description" content="Art direction, interactive design and UI for studios, brands and agencies.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Darker+Grotesque:wght@300..900&family=Hedvig+Letters+Serif:opsz@12..24&display=swap">

  <link rel="icon" type="image/gif" href="/assets/favicon/favicon-gif.gif" sizes="any">
  <link rel="preload" as="image" href="/hero-day-opt.webp" fetchpriority="high">

  <!-- Preloader: sync gate runs BEFORE first paint. If this is a returning
       tab/session, mark <html> so the static shell is hidden immediately. -->
  <script>
    try { if (sessionStorage.getItem('pp:visited')) document.documentElement.classList.add('no-preload'); } catch (e) {}
  </script>
  <!-- Strip powerPreference on Windows (crbug.com/369219127 — Chrome ignores it, triggers a console warning) -->
  <script>
  try{if(navigator.gpu&&typeof navigator.gpu.requestAdapter==='function'&&/Windows|Win32|Win64/.test(navigator.userAgent)){var _ra=navigator.gpu.requestAdapter;navigator.gpu.requestAdapter=function(o){if(o&&typeof o==='object'){var c={};for(var k in o){if(Object.prototype.hasOwnProperty.call(o,k)&&k!=='powerPreference')c[k]=o[k]}return _ra.call(this,c)}return _ra.call(this,o)}}}catch(e){}
  </script>
  <style>
    /* Critical pre-paint styles for the first-landing preloader shell. */
    html{background:#F5F1EA;scrollbar-gutter:stable;}
    #preloader{position:fixed;inset:0;z-index:9999;background:#F5F1EA;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden;pointer-events:auto;cursor:pointer;}
    #preloader.preloader--dissolve{pointer-events:none;cursor:default;}
    #preloader.preloader--reveal{background:transparent;}
    #preloader.preloader--no-gl.preloader--reveal{opacity:0;transition:opacity 4s ease;}
    html.no-preload #preloader{display:none!important;}
    .preloader__canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
    .preloader__gl{display:block;width:100%;height:100%;}
    .preloader__start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .38s ease;}
    .preloader__start *{pointer-events:none;}
    #preloader.preloader--dissolve .preloader__enter{animation:none;opacity:0;transition:opacity .3s ease;}
    @media (prefers-reduced-motion: reduce){
      .preloader__enter{animation:none;opacity:.92;}
    }
    .preloader__enter{position:absolute;left:0;right:0;bottom:clamp(28px,7vh,72px);text-align:center;color:#111;font-family:ui-sans-serif,system-ui,'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(11px,1.35vw,14px);letter-spacing:.38em;text-transform:uppercase;opacity:0;animation:preEnterIn 900ms ease .45s forwards;}
    @keyframes preEnterIn{to{opacity:.92;}}
    .preloader__sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
    .preloader__fallback{display:none;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-weight:700;font-size:clamp(64px,18vw,220px);color:#111;padding:clamp(24px,5vw,80px);line-height:0.9;letter-spacing:-0.02em;opacity:0;transform:translateY(14px);}
    #preloader.preloader--counting .preloader__fallback{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(0.16,1,0.3,1);}
    .preloader--no-gl .preloader__fallback{display:block;}
  </style>
  <noscript><style>#preloader{display:none!important}</style></noscript>
</head>
<body>
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader__canvas"></div>
    <div class="preloader__start">
      <div class="preloader__enter">CLICK TO ENTER</div>
    </div>
    <div class="preloader__sr" aria-live="polite"></div>
    <div class="preloader__fallback" aria-hidden="true"></div>
  </div>
  <div id="root"></div>
  <script src="/js/dottedGrid.js?v=6" defer></script>
  <script type="module" src="/src/preloader/index.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
