<script>
  // ─── FIREBASE CONFIG ────────────────────────────────────────────────────────
  var firebaseConfig = {
    apiKey: "___FIREBASE_API_KEY___",
    authDomain: "___FIREBASE_AUTH_DOMAIN___",
    databaseURL: "___FIREBASE_DATABASE_URL___",
    projectId: "___FIREBASE_PROJECT_ID___",
    storageBucket: "___FIREBASE_STORAGE_BUCKET___",
    messagingSenderId: "___FIREBASE_MESSAGING_SENDER_ID___",
    appId: "___FIREBASE_APP_ID___"
  };
  // ────────────────────────────────────────────────────────────────────────────

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  (function initOpglLike() {
    var CONSOLE_KEY = 'opgl_like_logged';

    document.querySelectorAll('.opgl-stage').forEach(function(stage, stageIndex) {
      var btn = stage.querySelector('[data-opgl-like]');
      if (!btn) return;

      var countSpan = btn.querySelector('.opgl-like-count');
      var dbRef = db.ref('likes/stage_' + stageIndex);

      // Ascolta in tempo reale: aggiorna il contatore per tutti gli utenti connessi
      dbRef.on('value', function(snapshot) {
        var count = snapshot.val() || 0;
        countSpan.textContent = count;
        if (count > 0) btn.classList.add('is-liked');
      });

      btn.addEventListener('click', function() {
        // runTransaction garantisce incremento atomico senza race condition tra utenti
        dbRef.transaction(function(current) {
          return (current || 0) + 1;
        });

        if (!sessionStorage.getItem(CONSOLE_KEY)) {
          sessionStorage.setItem(CONSOLE_KEY, '1');
          console.log('Grazie, non abbiamo preso nessun dato e nessun tracker ti ha intercettato.');
        }
      });
    });
  })();

  (function initOpglNav() {
    document.querySelectorAll('.opgl-stage').forEach(function(stage) {
      var wrapper = stage.querySelector('.wrapper');
      if (!wrapper) return;

      var cards = wrapper.querySelectorAll('.image-squ');
      var totalCards = cards.length;
      var visibleCards = 3;
      var maxOffset = Math.max(0, totalCards - visibleCards);
      var currentOffset = 0;

      var prevBtn = stage.querySelector('[data-opgl-nav="prev"]');
      var nextBtn = stage.querySelector('[data-opgl-nav="next"]');

      function updateNav() {
        wrapper.style.setProperty('--nav-offset', currentOffset);
        if (prevBtn) prevBtn.disabled = currentOffset <= 0;
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', function() {
          currentOffset = Math.max(0, currentOffset - 1);
          updateNav();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', function() {
          if (currentOffset >= maxOffset) {
            currentOffset = 0;
          } else {
            currentOffset += 1;
          }
          updateNav();
        });
      }

      updateNav();
    });
  })();

  (function initWrappers() {
    document.querySelectorAll('.wrapper').forEach(function(wrapper) {
      var cards = Array.from(wrapper.children);
      var count = cards.length;
      wrapper.style.setProperty('--cards', count);
      var center = (count - 1) / 2;
      cards.forEach(function(card, i) {
        card.style.setProperty('--card-i', i + 1);
        var dist = Math.abs(i - center);
        card.style.zIndex = Math.round(center - dist);
      });
    });
  })();
</script>
